<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragon Connect Portal</title>
</head>
<body>
    <h1>Paragon Connect Portal</h1>
    <button id="connect-slack">Connect Slack</button>

    <script src="https://cdn.useparagon.com/sdk/latest/sdk.js"></script>
    <script>
        async function init() {
            try {
                const response = await fetch('/config');
                const { projectId, token } = await response.json();

                // Initialize the Paragon SDK
                paragon.authenticate(projectId, token);

                document.getElementById('connect-slack').addEventListener('click', () => {
                    // Trigger paragon.connect('slack')
                    paragon.connect('slack');
                });
            } catch (error) {
                console.error('Failed to initialize Paragon SDK:', error);
            }
        }

        init();
    </script>
</body>
</html>

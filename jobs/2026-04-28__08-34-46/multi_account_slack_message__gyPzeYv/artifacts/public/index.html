<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragon Multi-Account Slack</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; }
        select, textarea, input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        button { padding: 0.75rem 1.5rem; background: #007bff; color: white; border: none; cursor: pointer; }
        button:disabled { background: #ccc; }
        #status { margin-top: 1rem; padding: 1rem; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Send Slack Message</h1>
    <div id="auth-section">
        <p>Initializing Paragon...</p>
    </div>
    <div id="message-section" style="display:none;">
        <div class="form-group">
            <label for="account-select">Select Slack Account</label>
            <select id="account-select"></select>
        </div>
        <div class="form-group">
            <label for="channel-select">Select Channel</label>
            <select id="channel-select">
                <option value="">Loading channels...</option>
            </select>
        </div>
        <div class="form-group">
            <label for="message-input">Message</label>
            <textarea id="message-input" rows="4" placeholder="Enter your message here..."></textarea>
        </div>
        <button id="send-btn">Send Message</button>
    </div>
    <div id="status"></div>

    <script src="https://cdn.useparagon.com/sdk/latest/sdk.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
